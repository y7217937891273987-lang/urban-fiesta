version: '3.8'

services:
  ace-backend:
    build: .
    container_name: ace-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - BACKEND_PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./config:/app/config
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ace-network

  ace-ui:
    image: node:18-slim
    container_name: ace-ui
    working_dir: /app/ui
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - PORT=3000
    volumes:
      - ./ui:/app/ui
      - /app/ui/node_modules
    depends_on:
      - ace-backend
    networks:
      - ace-network

networks:
  ace-network:
    driver: bridge

volumes:
  artifacts:
  logs:
